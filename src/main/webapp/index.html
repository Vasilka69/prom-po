<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Файлы</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fa;
            padding: 2rem;
            color: #333;
        }

        h1, h3 {
            text-align: center;
        }

        input, button {
            padding: 10px 15px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input {
            width: 300px;
            font-size: 16px;
        }

        button {
            background-color: rgba(77, 112, 241, 0.96);
            color: white;
            cursor: pointer;
        }

        .search-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .file-list {
            margin-top: 2rem;
            max-width: 60%;
            margin-left: auto;
            margin-right: auto;
        }

        .file-item {
            background-color: #ffffff;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        pre {
            background-color: #2d2d2d;
            font-size: 16px;
            color: #f8f8f2;
            border-radius: 5px;
            padding: 15px;
            white-space: pre-wrap;
            max-width: 100%;
        }
    </style>
</head>
<body>

<h1>Файлы</h1>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Поиск по слову"/>
    <button onclick="searchByWord()" id="searchButton" >Найти</button>
    <button onclick="loadAll()">Показать все</button>
</div>

<div class="file-list" id="fileList"></div>

<script>
    window.onload = function () {
        const apiBase = 'api/file-index';

        function loadAll() {
            fetch(apiBase)
                .then(r => r.json())
                .then(showFiles)
                .catch(console.error);
        }

        function searchByWord() {
            const word = document.getElementById('searchInput').value;
            fetch(`${apiBase}?word=${encodeURIComponent(word)}`)
                .then(r => r.json())
                .then(showFiles)
                .catch(console.error);
        }

        function showFiles(files) {
            const list = document.getElementById('fileList');
            list.innerHTML = '';

            if (!files || files.length === 0) {
                list.innerHTML = `<h3>Нет файлов.</h3>`;
                return;
            }

            files.forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-item';

                div.innerHTML = `
          <strong>${file.filePath}</strong><br>
          <button onclick="showContent('${file.id}')">Показать содержимое</button>
          <button onclick="downloadFile('${file.id}')">Скачать</button>
          <pre id="content-${file.id}" style="display:none;"></pre>
        `;
                list.appendChild(div);
            });
        }

        window.showContent = function (id) {
            const pre = document.getElementById(`content-${id}`);
            if (pre.style.display === 'block') {
                pre.style.display = 'none';
                return;
            }

            fetch(`${apiBase}/content?id=${id}`)
                .then(r => r.text())
                .then(content => {
                    pre.textContent = content;
                    pre.style.display = 'block';
                })
                .catch(err => {
                    pre.textContent = 'Ошибка при загрузке содержимого';
                    pre.style.display = 'block';
                    console.error(err);
                });
        };

        window.downloadFile = function (id) {
            window.location.href = `${apiBase}/download?id=${id}`;
        };

        document.getElementById('searchInput').addEventListener("keyup", function (event) {
            if (event.key === "Enter") {
                document.getElementById('searchButton').click();
            }
        });

        window.searchByWord = searchByWord;
        window.loadAll = loadAll;

        loadAll();
    };
</script>
